version: '3.8'

services:
  online-error-fix:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        ENV: dev
    container_name: online-error-fix
    ports:
      - "8000:8000"
    environment:
      - ENV=dev
    volumes:
      - ./logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health').read()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

